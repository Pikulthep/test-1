name: Daily Movie Scrape

on:
  schedule:
    - cron: '13 3 1,16 * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  run-movie-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 360 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip' 

      # 🌟 ติดตั้งระบบหน้าจอเสมือน (Xvfb)
      - name: Install Display Server (Xvfb)
        run: sudo apt-get install -y xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output directory
        run: mkdir -p output

      # 🌟 รันสคริปต์ภายใต้หน้าจอเสมือน (xvfb-run)
      - name: Run Chinese Movie Script (เว็บโรงหยก)
        run: xvfb-run --auto-servernum python chinese_movie.py

      - name: Commit and Push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/*
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update movies: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "No changes to commit"
          fi
